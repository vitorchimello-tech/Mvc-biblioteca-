<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores</h1>
<nav>
    <a th:href="@{/}">Início</a> |
    <a th:href="@{/livros}">Livros</a> |
    <a th:href="@{/autores}">Autores</a> |
    <a th:href="@{/categorias}">Categorias</a> |
    <a th:href="@{/usuarios}">Usuários</a> |
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<table border="1">
    <tr><th>Nome</th><th>Nacionalidade</th><th>Obras publicadas</th></tr>
    <tr th:each="autor : ${autores}">
        <td th:text="${autor.nome}"></td>
        <td th:text="${autor.nacionalidade}"></td>
        <td><span th:each="obra : ${autor.obrasPublicadas}" th:text="${obra.titulo} + ' '"></span></td>
    </tr>
</table>
</body>
</html>
