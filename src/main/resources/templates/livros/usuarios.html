<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
</head>
<body>
<h1>Usuários</h1>
<nav>
    <a th:href="@{/}">Início</a> |
    <a th:href="@{/livros}">Livros</a> |
    <a th:href="@{/autores}">Autores</a> |
    <a th:href="@{/categorias}">Categorias</a> |
    <a th:href="@{/usuarios}">Usuários</a> |
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>
<table border="1">
    <tr><th>Nome</th><th>Matrícula</th><th>E-mail</th></tr>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.nome}"></td>
        <td th:text="${usuario.matricula}"></td>
        <td th:text="${usuario.email}"></td>
    </tr>
</table>
</body>
</html>
